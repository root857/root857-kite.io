<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鸢色工坊</title>
  <style>
    /* 基础样式 */
    :root {
      --primary-color: #4a6fa5;
      --secondary-color: #ff6b6b;
      --text-color: #333;
      --light-bg: rgba(255, 255, 255, 0.85);
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      text-align: center;
      background-image: url('./3.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      color: var(--text-color);
      line-height: 1.6;
    }
    
    /* 背景遮罩层 */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: -1;
    }
    
    /* 容器布局 */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }
    
    .kite-column {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 300px;
      max-width: 400px;
    }
    
    .content {
      flex: 1;
      min-width: 300px;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* 卡片设计 */
    .kite-info,
    .kite-culture {
      padding: 25px;
      background-color: var(--light-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      font-size: 16px;
      margin-bottom: 25px;
      transition: all 0.3s ease;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .kite-info:hover,
    .kite-culture:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .kite-info h3,
    .kite-culture h3 {
      color: var(--primary-color);
      margin-top: 0;
      font-size: 20px;
      position: relative;
      padding-bottom: 10px;
    }
    
    .kite-info h3::after,
    .kite-culture h3::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: var(--secondary-color);
    }
    
    /* 风筝选择器 */
    .kite-selector {
      margin-bottom: 20px;
      width: 100%;
      max-width: 350px;
    }
    
    .kite-selector select {
      width: 100%;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background-color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .kite-selector select:hover {
      background-color: rgba(255, 255, 255, 0.9);
    }
    
    /* 风筝SVG样式 */
    .content h2 {
      font-size: 28px;
      margin-bottom: 15px;
      color: white;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.5);
      position: relative;
      padding-bottom: 10px;
    }
    
    .content h2::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: white;
    }
    
    svg {
      width: 100%;
      max-width: 350px;
      height: auto;
      aspect-ratio: 6/7;
      cursor: pointer;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      transition: all 0.3s ease;
      display: block;
      margin: 0 auto;
      padding: 15px;
      backdrop-filter: blur(3px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    svg:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      background-color: rgba(255, 255, 255, 0.25);
    }
    
    /* 颜色选择器 */
    #colorPicker {
      display: none;
    }
    
    /* 响应式调整 */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      
      .kite-column {
        width: 100%;
        max-width: 600px;
      }
      
      .content {
        order: -1;
        margin-bottom: 30px;
      }
    }
    
    @media (max-width: 500px) {
      .kite-info,
      .kite-culture {
        padding: 15px;
      }
      
      .content h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 中间风筝图案 -->
  <div class="content">
    <h2>鸢色工坊</h2>
    
    <div class="kite-selector">
      <select id="kiteStyle">
        <option value="panda">熊猫风筝</option>
        <option value="dragon">龙形风筝</option>
        <option value="butterfly">蝴蝶风筝</option>
        <option value="fish">鲤鱼风筝</option>
        <option value="eagle">鹰形风筝</option>
        <option value="geometric1">几何风筝1</option>
        <option value="geometric2">几何风筝2</option>
        <option value="bird">燕子风筝</option>
        <option value="bat">蝙蝠风筝</option>
        <option value="flower">花卉风筝</option>
      </select>
    </div>

    <svg id="kite" viewBox="0 0 200 250">
      <!-- 风筝内容将通过JavaScript动态加载 -->
    </svg>

    <input type="color" id="colorPicker" />
  </div>

  <!-- 左侧风筝信息 -->
  <div class="kite-column">
    <div class="kite-info">
      <h3>风筝的介绍</h3>
      <p>风筝的历史可追溯至中国春秋战国时期（约公元前5世纪），相传由墨子或鲁班以木头或竹子制成"木鸢"，后因造纸术普及演变为"纸鸢"。早期主要用于军事，如汉代韩信测距、南北朝传递求救信号，唐代后逐渐成为民间娱乐活动。约13世纪，风筝经丝绸之路传入阿拉伯及欧洲，进而影响全球。</p>
    </div>
    <div class="kite-culture">
      <h3>有关于风筝的民俗文化</h3>
      <p>在中国，放风筝不仅是一种传统游戏，更承载着人们对健康、好运、和平的祝愿。清明节放风筝是常见习俗，人们相信放飞风筝能带走病痛和厄运。风筝图案也富有寓意，如蝴蝶象征爱情、龙象征权威，燕子代表好运和春天的到来。</p>
    </div>
  </div>
</div>

<script>
  // 风筝样式数据
  const kiteDesigns = {
    panda: `
      <!-- 熊猫风筝 -->
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="red" />
      <circle cx="110" cy="220" r="4" fill="red" />
      <circle cx="100" cy="240" r="4" fill="red" />
      <ellipse id="body" cx="100" cy="160" rx="60" ry="40" fill="#fff" stroke="#000" stroke-width="2"/>
      <ellipse id="leftBackLeg" cx="70" cy="190" rx="12" ry="20" fill="#000"/>
      <ellipse id="rightBackLeg" cx="130" cy="190" rx="12" ry="20" fill="#000"/>
      <ellipse id="leftFrontLeg" cx="60" cy="150" rx="10" ry="18" fill="#000"/>
      <ellipse id="rightFrontLeg" cx="140" cy="150" rx="10" ry="18" fill="#000"/>
      <circle id="face" cx="100" cy="80" r="50" fill="#fff" stroke="#000" stroke-width="2"/>
      <circle id="leftEar" cx="60" cy="30" r="15" fill="#000"/>
      <circle id="rightEar" cx="140" cy="30" r="15" fill="#000"/>
      <ellipse id="leftEye" cx="75" cy="80" rx="10" ry="15" fill="#000"/>
      <ellipse id="rightEye" cx="125" cy="80" rx="10" ry="15" fill="#000"/>
      <circle cx="75" cy="80" r="4" fill="#fff"/>
      <circle cx="125" cy="80" r="4" fill="#fff"/>
      <path id="nose" d="M95 95 Q100 100 105 95" fill="#000"/>
      <path d="M90 105 Q100 115 110 105" stroke="#000" stroke-width="2" fill="none"/>
      <circle cx="60" cy="95" r="5" fill="pink" opacity="0.5"/>
      <circle cx="140" cy="95" r="5" fill="pink" opacity="0.5"/>
    `,
    dragon: `
      <!-- 龙形风筝 -->
      <path id="body" d="M50,100 Q70,50 100,60 Q130,50 150,100 Q170,150 150,200 Q130,250 100,240 Q70,250 50,200 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <circle id="head" cx="50" cy="100" r="20" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <path id="horn1" d="M40,80 L30,40 L45,70 Z" fill="#f1c40f"/>
      <path id="horn2" d="M60,80 L70,40 L55,70 Z" fill="#f1c40f"/>
      <circle id="eye" cx="45" cy="95" r="3" fill="#000"/>
      <path id="mouth" d="M40,110 Q50,115 60,110" stroke="#000" stroke-width="2" fill="none"/>
      <path id="tail" d="M150,200 Q170,220 160,240 Q150,260 140,240 Q130,220 150,200" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#f1c40f" />
      <circle cx="110" cy="220" r="4" fill="#f1c40f" />
      <circle cx="100" cy="240" r="4" fill="#f1c40f" />
    `,
    butterfly: `
      <!-- 蝴蝶风筝 -->
      <path id="leftWing" d="M50,50 Q20,100 50,150 Q80,120 100,100 Q80,80 50,50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <path id="rightWing" d="M150,50 Q180,100 150,150 Q120,120 100,100 Q120,80 150,50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
      <ellipse id="body" cx="100" cy="100" rx="5" ry="30" fill="#34495e"/>
      <circle id="head" cx="100" cy="70" r="8" fill="#34495e"/>
      <path id="antenna1" d="M100,70 L90,50" stroke="#34495e" stroke-width="2"/>
      <path id="antenna2" d="M100,70 L110,50" stroke="#34495e" stroke-width="2"/>
      <circle cx="90" cy="50" r="3" fill="#f1c40f"/>
      <circle cx="110" cy="50" r="3" fill="#f1c40f"/>
      <polyline points="100,130 90,150 110,170 100,190" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="150" r="4" fill="#e74c3c" />
      <circle cx="110" cy="170" r="4" fill="#e74c3c" />
      <circle cx="100" cy="190" r="4" fill="#e74c3c" />
    `,
    fish: `
      <!-- 鲤鱼风筝 -->
      <path id="body" d="M60,100 Q100,50 140,100 Q100,150 60,100 Z" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
      <path id="tail" d="M140,100 Q160,80 180,100 Q160,120 140,100" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
      <circle id="eye" cx="80" cy="90" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
      <circle cx="80" cy="90" r="2" fill="#000"/>
      <path id="mouth" d="M70,105 Q80,110 90,105" stroke="#000" stroke-width="1" fill="none"/>
      <path id="fin" d="M100,110 Q110,100 100,90" fill="#d35400" stroke="#a04000" stroke-width="1"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#3498db" />
      <circle cx="110" cy="220" r="4" fill="#3498db" />
      <circle cx="100" cy="240" r="4" fill="#3498db" />
      <path id="scales" d="M80,110 Q90,115 100,110 Q90,105 80,110 M90,115 Q100,120 110,115 Q100,110 90,115 M100,120 Q110,125 120,120 Q110,115 100,120" stroke="#d35400" stroke-width="1" fill="none"/>
    `,
    eagle: `
      <!-- 鹰形风筝 -->
      <path id="body" d="M80,80 Q100,40 120,80 Q140,120 120,160 Q100,200 80,160 Q60,120 80,80" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <path id="beak" d="M120,80 L140,90 L120,100 Z" fill="#f1c40f"/>
      <circle id="eye" cx="110" cy="90" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
      <circle cx="110" cy="90" r="2" fill="#000"/>
      <path id="wing1" d="M90,100 Q60,80 70,120 Q50,110 60,140 Q80,130 90,150" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>
      <path id="wing2" d="M110,100 Q140,80 130,120 Q150,110 140,140 Q120,130 110,150" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#e74c3c" />
      <circle cx="110" cy="220" r="4" fill="#e74c3c" />
      <circle cx="100" cy="240" r="4" fill="#e74c3c" />
    `,
    geometric1: `
      <!-- 几何风筝1 -->
      <polygon id="body" points="100,50 150,150 100,250 50,150" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
      <circle id="center" cx="100" cy="150" r="30" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <line x1="100" y1="50" x2="100" y2="250" stroke="#fff" stroke-width="2"/>
      <line x1="50" y1="150" x2="150" y2="150" stroke="#fff" stroke-width="2"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#f1c40f" />
      <circle cx="110" cy="220" r="4" fill="#f1c40f" />
      <circle cx="100" cy="240" r="4" fill="#f1c40f" />
    `,
    geometric2: `
      <!-- 几何风筝2 -->
      <rect id="body" x="50" y="50" width="100" height="100" rx="10" fill="#2ecc71" stroke="#27ae60" stroke-width="2" transform="rotate(45 100 100)"/>
      <circle id="circle1" cx="100" cy="70" r="15" fill="#e74c3c"/>
      <circle id="circle2" cx="130" cy="100" r="15" fill="#f1c40f"/>
      <circle id="circle3" cx="100" cy="130" r="15" fill="#3498db"/>
      <circle id="circle4" cx="70" cy="100" r="15" fill="#9b59b6"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#e74c3c" />
      <circle cx="110" cy="220" r="4" fill="#e74c3c" />
      <circle cx="100" cy="240" r="4" fill="#e74c3c" />
    `,
    bird: `
      <!-- 燕子风筝 -->
      <path id="body" d="M80,100 Q100,70 120,100 Q140,130 120,160 Q100,190 80,160 Q60,130 80,100" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
      <path id="wing" d="M100,120 Q80,100 90,140 Q70,130 80,170 Q100,150 100,180" fill="#2c3e50"/>
      <path id="tail" d="M80,160 L60,180 L70,160 L50,170 L60,160 L40,160" fill="#2c3e50" stroke="#2c3e50" stroke-width="1"/>
      <circle id="eye" cx="110" cy="110" r="3" fill="#fff"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#e74c3c" />
      <circle cx="110" cy="220" r="4" fill="#e74c3c" />
      <circle cx="100" cy="240" r="4" fill="#e74c3c" />
    `,
    bat: `
      <!-- 蝙蝠风筝 -->
      <path id="body" d="M100,80 Q80,100 100,120 Q120,100 100,80" fill="#2c3e50" stroke="#000" stroke-width="1"/>
      <path id="wing1" d="M100,90 Q60,60 50,100 Q40,140 80,160 Q100,140 100,120" fill="#2c3e50" stroke="#000" stroke-width="1"/>
      <path id="wing2" d="M100,90 Q140,60 150,100 Q160,140 120,160 Q100,140 100,120" fill="#2c3e50" stroke="#000" stroke-width="1"/>
      <circle id="eye1" cx="95" cy="95" r="2" fill="#fff"/>
      <circle id="eye2" cx="105" cy="95" r="2" fill="#fff"/>
      <path id="ear1" d="M95,75 Q90,70 95,65 Q100,70 95,75" fill="#2c3e50" stroke="#000" stroke-width="1"/>
      <path id="ear2" d="M105,75 Q110,70 105,65 Q100,70 105,75" fill="#2c3e50" stroke="#000" stroke-width="1"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#e74c3c" />
      <circle cx="110" cy="220" r="4" fill="#e74c3c" />
      <circle cx="100" cy="240" r="4" fill="#e74c3c" />
    `,
    flower: `
      <!-- 花卉风筝 -->
      <circle id="center" cx="100" cy="100" r="20" fill="#f1c40f" stroke="#f39c12" stroke-width="2"/>
      <path id="petal1" d="M100,60 Q120,70 100,80 Q80,70 100,60" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <path id="petal2" d="M140,100 Q130,120 120,100 Q130,80 140,100" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <path id="petal3" d="M100,140 Q80,130 100,120 Q120,130 100,140" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <path id="petal4" d="M60,100 Q70,80 80,100 Q70,120 60,100" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
      <path id="petal5" d="M120,70 Q140,90 120,110 Q100,90 120,70" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
      <path id="petal6" d="M130,120 Q150,140 130,160 Q110,140 130,120" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
      <path id="petal7" d="M80,130 Q60,150 80,170 Q100,150 80,130" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
      <path id="petal8" d="M70,70 Q90,50 110,70 Q90,90 70,70" fill="#9b59b6" stroke="#8e44ad" stroke-width="1"/>
      <polyline points="100,180 90,200 110,220 100,240" fill="none" stroke="#000" stroke-width="2" />
      <circle cx="90" cy="200" r="4" fill="#2ecc71" />
      <circle cx="110" cy="220" r="4" fill="#2ecc71" />
      <circle cx="100" cy="240" r="4" fill="#2ecc71" />
    `
  };

  // 初始化变量
  const colorPicker = document.getElementById("colorPicker");
  const kiteSvg = document.getElementById("kite");
  const kiteSelector = document.getElementById("kiteStyle");
  let selectedPart = null;
  
  // 加载初始风筝
  loadKiteDesign('panda');
  
  // 切换风筝样式
  kiteSelector.addEventListener('change', (e) => {
    loadKiteDesign(e.target.value);
  });
  
  // 加载风筝设计函数
  function loadKiteDesign(design) {
    kiteSvg.innerHTML = kiteDesigns[design];
    
    // 重新绑定点击事件
    document.querySelectorAll("svg [id]").forEach(part => {
      part.addEventListener("click", (e) => {
        e.stopPropagation();
        
        if (selectedPart) {
          selectedPart.style.filter = "";
        }
        
        selectedPart = part;
        const currentColor = window.getComputedStyle(part).fill;
        colorPicker.value = rgbToHex(currentColor);
        part.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,0.8))";
        colorPicker.click();
      });
    });
  }
  
  // SVG空白处点击取消选择
  kiteSvg.addEventListener("click", (e) => {
    if (e.target === e.currentTarget && selectedPart) {
      selectedPart.style.filter = "";
      selectedPart = null;
    }
  });
  
  // 颜色选择器变化时应用颜色
  colorPicker.addEventListener("input", () => {
    if (selectedPart) {
      selectedPart.setAttribute("fill", colorPicker.value);
      selectedPart.style.filter = "drop-shadow(0 0 8px rgba(255,255,255,0.8))";
    }
  });
  
  // RGB转HEX
  function rgbToHex(rgb) {
    if (rgb.startsWith("#")) return rgb;
    
    const result = rgb.match(/\d+/g);
    if (!result) return "#000000";
    
    return `#${result.map(x => (+x).toString(16).padStart(2, "0")).join("")}`;
  }
</script>

</body>
</html>
